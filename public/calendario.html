<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendario</title>
  <link rel="icon" href="assets/images/logo.png" />
  <link rel="stylesheet" href="assets/css/calendario.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Fira+Sans:wght@200;400&family=Sunflower:wght@700&display=swap"
    rel="stylesheet"
  />
  <!-- Ionicons -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
  <header>
    <div>
      <h1>Reserva de citas</h1>
    </div>
  </header>

  <section>
    <h2>Fechas</h2>
    <div class="root">
      <div class="calendar" id="calendar"></div>
    </div>

    <a href="FormasPago.html"><button class="pagar">Pagar</button></a>
  </section>

  <!-- Icono de ayuda flotante -->
  <div class="icono-ayuda" onclick="mostrarAsesor()">
    <ion-icon name="person-outline"></ion-icon>
  </div>

  <!-- Tarjeta de asesor -->
  <div class="tarjeta-asesor" id="tarjetaAsesor">
    <div class="contenido-asesor">
      <h3>¿Necesitas ayuda?</h3>
      <p>
        Estoy aquí para guiarte en la reserva de tu cita médica. ¿En qué puedo ayudarte?
      </p>
      <button onclick="alert('Un asesor se pondrá en contacto contigo 😊')">
        Contactar Asesor
      </button>
    </div>
  </div>

  <footer>
    <section class="final">
      <small><b>Todos los derechos reservados VitalBlock&copy; 2025</b></small>
    </section>
  </footer>

  <!-- Scripts del calendario -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.24.0/moment.min.js"></script>
  <script src="assets/scripts/calendario.js"></script>
  <script>
    let calendar = new Calendar("calendar");
    calendar.getElement().addEventListener("change", (e) => {
      console.log(calendar.value().format("LLL"));
    });

    function mostrarAsesor() {
      const tarjeta = document.getElementById("tarjetaAsesor");
      tarjeta.classList.toggle("visible");
    }
  </script>
</body>
</html>
